<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nanda Sir Coaching Academy</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f7ff;
    color: #222;
}

/* HEADER */
header {
    background: linear-gradient(135deg, #0066ff, #002d80);
    color: white;
    text-align: center;
    padding: 42px 15px;
}

header h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

header p {
    margin: 5px;
    font-size: 16px;
}

/* CONTAINER */
.container {
    max-width: 850px;
    margin: 30px auto;
    padding: 15px;
}

/* CARD */
.card {
    background: white;
    padding: 28px;
    margin-bottom: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.card h2 {
    color: #005bea;
    text-align: center;
    margin-bottom: 20px;
}

/* INPUT */
input {
    width: 100%;
    padding: 15px;
    border: 2px solid #d7e4ff;
    border-radius: 10px;
    font-size: 17px;
    outline: none;
}

input:focus {
    border-color: #005bea;
}

/* BUTTON */
button {
    width: 100%;
    margin-top: 12px;
    padding: 15px;
    background: #005bea;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #003b95;
}

/* RESULT */
#result {
    display: none;
    margin-top: 25px;
    background: #f7faff;
    padding: 20px;
    border-radius: 12px;
}

.student-name {
    text-align: center;
    color: #003b95;
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 18px;
}

.row {
    display: flex;
    justify-content: space-between;
    padding: 13px 5px;
    border-bottom: 1px solid #ddd;
}

.pass {
    color: green;
    font-weight: bold;
}

.fail {
    color: red;
    font-weight: bold;
}

.not-published {
    text-align: center;
    color: #e06b00;
    font-weight: bold;
    font-size: 18px;
}

/* NOTICE */
.notice {
    text-align: center;
    line-height: 1.8;
}

/* CONTACT */
.contact {
    text-align: center;
    line-height: 2;
}

/* FOOTER */
footer {
    background: #002d80;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 40px;
}

/* MOBILE */
@media (max-width: 600px) {

    header h1 {
        font-size: 24px;
    }

    .card {
        padding: 20px;
    }

    .row {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>

    <h1>NANDA SIR COACHING ACADEMY</h1>

    <p>📍 Dungura</p>

    <p>📚 English</p>

    <p>📞 9583864750</p>

</header>


<div class="container">


<!-- RESULT SEARCH -->
<div class="card">

    <h2>🎓 Student Result</h2>

    <input
        type="text"
        id="rollNo"
        placeholder="Enter Your Roll Number"
        autocomplete="off"
    >

    <button onclick="showResult()">
        🔍 View Result
    </button>

    <div id="result"></div>

</div>


<!-- NOTICE -->
<div class="card">

    <h2>📢 Notice</h2>

    <div class="notice">

        <p>
            Student results will be published here.
        </p>

        <p>
            Enter your Roll Number to check your result.

</div>

function showResult() {

    let roll = document
        .getElementById("rollNo")
        .value
        .trim()
        .toUpperCase();

    let resultBox =
        document.getElementById("result");


    /* EMPTY ROLL NUMBER */

    if (roll === "") {

        resultBox.innerHTML = `
            <p style="text-align:center;color:red;font-weight:bold;">
                ⚠️ Please enter your Roll Number.
            </p>
        `;

        resultBox.style.display = "block";

        return;
    }


    /* STUDENT FOUND */

    if (students[roll]) {

        let student = students[roll];


        /* RESULT NOT PUBLISHED YET */

        if (student.english === "") {

            resultBox.innerHTML = `

                <div class="student-name">
                    ${student.name}
                </div>

                <div class="row">
                    <b>Roll No.</b>
                    <span>${roll}</span>
                </div>

                <div style="margin-top:20px;">
                    <p class="not-published">
                        📢 Result Not Published Yet
                    </p>

                    <p style="text-align:center;margin-top:8px;">
                        Please check again after the result is published.
                    </p>
                </div>

            `;

        }


        /* RESULT AVAILABLE */

        else {

            let marks = Number(student.english);

            let total = marks;

            let percentage = marks;

            let resultStatus =
                marks >= 33 ? "PASS" : "FAIL";


            let resultClass =
                marks >= 33 ? "pass" : "fail";


            resultBox.innerHTML = `

                <div class="student-name">
                    ${student.name}

                </div>

                <div class="row">
                    <b>English</b>

                </div>

                <div class="row">

                </div>

                <div class="row">
                    <b>Percentage</b>
                    <span>${percentage}%</span>
                </div>

                <div class="row">
                    <b>Result</b>
                    <span class="${resultClass}">
                        ${resultStatus}
                    </span>
                </div>

            `;
